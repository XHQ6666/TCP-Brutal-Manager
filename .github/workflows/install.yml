name: Installer
on:
  push:
    paths: ['install.sh', 'scripts/test-install.py', '.github/workflows/install.yml', 'docs/INSTALL.md']
  pull_request:
    paths: ['install.sh', 'scripts/test-install.py', '.github/workflows/install.yml', 'docs/INSTALL.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate installer without changing host services
        run: |
          bash -n install.sh
          python3 scripts/test-install.py
